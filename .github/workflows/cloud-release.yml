name: Cloud Release

# Cloud agents ONLY. On the Windows release host run `build.bat release`.
# Windows runs the same build.bat on a GitHub runner (version, notes, commit,
# tag and release are exactly what the local release makes); macOS and Linux
# then build that tag with build.sh and attach their packages.
#
#   gh workflow run cloud-release.yml -f dry_run=true    # build all, publish nothing
#   gh workflow run cloud-release.yml -f dry_run=false   # real release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every platform as workflow artifacts; push, tag and publish nothing
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Cloud releases run from main only (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test
        run: |
          python -m pip install -r requirements-build.txt pytest
          python -m pytest -q test_audio_engine.py

      - name: Dry run
        if: ${{ inputs.dry_run }}
        shell: cmd
        run: |
          call build.bat dry-run || exit /b 1
          call build.bat build

      - name: Release
        if: ${{ !inputs.dry_run }}
        shell: cmd
        run: call build.bat release

      - name: Record tag
        id: tag
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            tag="$(git describe --tags --exact-match HEAD)"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ToneGenerator-windows
          path: dist/ToneGenerator.exe
          if-no-files-found: error

  unix:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: ToneGenerator-macos.zip
          - os: ubuntu-24.04
            asset: ToneGenerator-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.windows.outputs.ref }}

      - uses: actions/setup-python@v6
        if: ${{ runner.os == 'macOS' }}
        with:
          python-version: "3.14"

      # wxPython has no Linux pip wheel; use Ubuntu's in a venv that sees it.
      - name: Prepare Linux Python
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-wxgtk4.0 libportaudio2 libpulse0 xvfb
          python3 -m venv --system-site-packages .venv
          echo "PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Launch check
        if: ${{ runner.os == 'Linux' }}
        run: |
          set +e
          timeout 10 xvfb-run -a dist/ToneGenerator
          [ $? = 124 ] || { echo "::error::ToneGenerator exited before 10 s"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: ${{ !inputs.dry_run }}
        run: |
          tag="${{ needs.windows.outputs.tag }}"
          v="${tag#v}"
          ext="${{ matrix.asset }}"; ext="${ext#ToneGenerator-}"
          name="ToneGenerator-v$v-$ext"
          cp "dist/${{ matrix.asset }}" "$name"
          gh release upload "$tag" "$name" --clobber --repo "$GITHUB_REPOSITORY"
