name: Cloud Release

# Every public release runs here, on GitHub runners.
# Windows runs the same build.bat on a GitHub runner (version, notes, commit,
# tag and release are exactly what the local release makes); macOS and Linux
# then build that tag with build.sh and attach their packages.
#
#   gh workflow run cloud-release.yml -f dry_run=true    # build all, publish nothing
#   gh workflow run cloud-release.yml -f dry_run=false   # real release
#   gh workflow run cloud-release.yml -f dry_run=false -f attach_tag=vX.Y.Z
#       # rebuild only macOS and Linux and attach them to that existing release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every platform as workflow artifacts; push, tag and publish nothing
        required: false
        default: true
        type: boolean
      attach_tag:
        description: Existing release tag; skip Windows, build and attach only macOS and Linux
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ inputs.attach_tag == '' }}
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Cloud releases run from main only (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test
        run: |
          python -m pip install -r requirements-build.txt pytest
          python -m pytest -q test_audio_engine.py

      - name: Add the Forgejo remote
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: git remote add forgejo "https://x-access-token:$env:FORGEJO_TOKEN@git.serrebiradio.com/serrebi/tone-generator.git"

      - name: Dry run
        if: ${{ inputs.dry_run }}
        shell: cmd
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          call build.bat dry-run || exit /b 1
          call build.bat build

      - name: Release
        if: ${{ !inputs.dry_run }}
        shell: cmd
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: call build.bat release

      - name: Push the release commit and tag to GitHub
        if: ${{ !inputs.dry_run }}
        run: |
          $tag = git describe --tags --exact-match HEAD
          if ($LASTEXITCODE -ne 0) { throw "No release tag on HEAD" }
          # The Forgejo-to-GitHub sync may already have pushed this same commit
          # and tag: that is success, only a different commit is a failure.
          $head = git rev-parse HEAD
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            git fetch origin main
            if ((git rev-parse FETCH_HEAD) -ne $head) { throw "git push main failed" }
          }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) {
            git fetch origin "refs/tags/${tag}:refs/tags/remote-$tag"
            if ((git rev-parse "remote-$tag^{commit}") -ne $head) { throw "git push $tag failed" }
          }
          $global:LASTEXITCODE = 0

      - name: Record tag
        id: tag
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            tag="$(git describe --tags --exact-match HEAD)"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ToneGenerator-windows
          path: dist/ToneGenerator.exe
          if-no-files-found: error

  unix:
    needs: windows
    if: ${{ !cancelled() && (needs.windows.result == 'success' || inputs.attach_tag != '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            asset: ToneGenerator-macos.zip
          - os: ubuntu-24.04
            asset: ToneGenerator-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.attach_tag || needs.windows.outputs.ref }}

      - uses: actions/setup-python@v7
        if: ${{ runner.os == 'macOS' }}
        with:
          python-version: "3.14"

      # wxPython has no Linux pip wheel; use Ubuntu's in a venv that sees it.
      - name: Prepare Linux Python
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-wxgtk4.0 libportaudio2 libpulse0 xvfb
          python3 -m venv --system-site-packages .venv
          echo "PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Launch check
        if: ${{ runner.os == 'Linux' }}
        run: |
          set +e
          timeout 10 xvfb-run -a dist/ToneGenerator
          [ $? = 124 ] || { echo "::error::ToneGenerator exited before 10 s"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: ${{ !inputs.dry_run }}
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          tag="${{ inputs.attach_tag || needs.windows.outputs.tag }}"
          v="${tag#v}"
          ext="${{ matrix.asset }}"; ext="${ext#ToneGenerator-}"
          name="ToneGenerator-v$v-$ext"
          cp "dist/${{ matrix.asset }}" "$name"
          PY="${PYTHON:-python3}"
          "$PY" tools/forgejo_release.py upload "$tag" "$name"
